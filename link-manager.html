<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크 관리</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #f0f2f8;
    --border: #dde1ef;
    --accent: #5b48e8;
    --accent2: #00b896;
    --text: #1e1e2e;
    --text-muted: #8888a8;
    --danger: #e53e3e;
    --success: #00b896;
    --card-hover: #ededff;
    --shadow: 0 2px 12px rgba(91,72,232,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(91,72,232,0.06) 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(0,184,150,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(91,72,232,0.25);
  }

  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }

  .stats {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    box-shadow: var(--shadow);
  }
  .stats span { color: var(--accent); font-weight: 600; }

  /* ── 저장된 링크 (상단) ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    display: block; width: 3px; height: 14px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 2px;
  }
  .btn-clear-all {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 0.78rem;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 4px 10px; border-radius: 6px; transition: all 0.15s;
  }
  .btn-clear-all:hover { color: var(--danger); background: rgba(229,62,62,0.07); }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 11px;
    margin-bottom: 28px;
  }

  .link-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.18s;
    display: flex; align-items: center; gap: 11px;
    cursor: pointer;
    box-shadow: var(--shadow);
    animation: cardIn 0.22s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  .link-card:hover {
    border-color: var(--accent);
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(91,72,232,0.14);
  }
  .link-favicon {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; overflow: hidden;
    border: 1px solid var(--border);
  }
  .link-favicon img { width: 18px; height: 18px; object-fit: contain; }
  .link-info { flex: 1; min-width: 0; }
  .link-name {
    font-size: 0.88rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .link-domain {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty-state {
    text-align: center; padding: 40px 24px; color: var(--text-muted);
    border: 1.5px dashed var(--border); border-radius: 16px;
    margin-bottom: 28px; background: var(--surface);
  }
  .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; opacity: 0.45; }
  .empty-state p { font-size: 0.86rem; line-height: 1.7; }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 24px 0;
  }

  /* ── 편집 패널 (하단) ── */
  .editor-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .editor-panel:focus-within { border-color: var(--accent); }

  .editor-title {
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); margin-bottom: 16px;
  }

  .entries-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

  .entry-row {
    display: grid;
    grid-template-columns: 1fr 2fr auto;
    gap: 10px; align-items: center;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  input[type="text"], input[type="url"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 13px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.9rem; outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
  }
  input[type="text"]:focus, input[type="url"]:focus {
    border-color: var(--accent); background: #fafaff;
  }
  input::placeholder { color: var(--text-muted); font-size: 0.84rem; }

  .btn-remove {
    background: none; border: 1px solid transparent;
    border-radius: 7px; color: var(--text-muted);
    cursor: pointer; padding: 8px 10px;
    font-size: 1.05rem; line-height: 1;
    transition: all 0.15s; flex-shrink: 0;
  }
  .btn-remove:hover {
    color: var(--danger); border-color: var(--danger);
    background: rgba(229,62,62,0.07);
  }

  .editor-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    border: none; border-radius: 9px; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.87rem; font-weight: 500;
    padding: 10px 18px; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-add {
    background: var(--surface2); color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-add:hover { background: #eceeff; color: var(--accent); border-color: var(--accent); }
  .btn-save {
    background: linear-gradient(135deg, var(--accent), #8470ff);
    color: #fff; margin-left: auto;
    box-shadow: 0 4px 14px rgba(91,72,232,0.28);
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(91,72,232,0.38); }
  .btn-save:active { transform: translateY(0); }

  /* Toast */
  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    border-radius: 10px; padding: 11px 22px;
    font-size: 0.88rem; font-weight: 600;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 8px 28px rgba(0,0,0,0.12);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 모바일 */
  @media (max-width: 520px) {
    body { padding: 16px 12px; }
    .entry-row { grid-template-columns: 1fr auto; }
    .entry-row input[type="url"] { grid-column: 1; }
    .links-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <h1>링크 관리</h1>
    </div>
    <div class="stats">저장된 링크 <span id="link-count">0</span>개</div>
  </header>

  <!-- ① 저장된 링크 (상단) -->
  <div class="section-header">
    <div class="section-title">저장된 링크</div>
    <button class="btn-clear-all" onclick="clearAll()">전체 삭제</button>
  </div>
  <div class="links-grid" id="links-grid">
    <div class="empty-state">
      <div class="icon">🌐</div>
      <p>아직 저장된 링크가 없어요.<br>아래에서 이름과 URL을 입력하고 저장해보세요.</p>
    </div>
  </div>

  <div class="divider"></div>

  <!-- ② 편집 패널 (하단) -->
  <div class="editor-panel">
    <div class="editor-title">✏️ 링크 추가 / 편집</div>
    <div class="entries-list" id="entries-list"></div>
    <div class="editor-actions">
      <button class="btn btn-add" onclick="addRow()">+ 행 추가</button>
      <button class="btn btn-save" onclick="saveLinks()">💾 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'link_manager_v1';
let links = [];

function loadLinks() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    links = saved ? JSON.parse(saved) : [];
  } catch(e) { links = []; }
}

function saveToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
}

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); }
  catch(e) { return url; }
}

function getFaviconUrl(url) {
  try {
    const domain = new URL(url).origin;
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
  } catch(e) { return null; }
}

function addRow(name='', url='') {
  const list = document.getElementById('entries-list');
  const row = document.createElement('div');
  row.className = 'entry-row';
  row.innerHTML = `
    <input type="text" placeholder="이름 (예: 구글)" value="${escHtml(name)}">
    <input type="url"  placeholder="URL (https://...)" value="${escHtml(url)}">
    <button class="btn-remove" onclick="removeRow(this)" title="삭제">✕</button>
  `;
  list.appendChild(row);
}

function removeRow(btn) { btn.closest('.entry-row').remove(); }

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function saveLinks() {
  const rows = document.querySelectorAll('.entry-row');
  const newLinks = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const name = inputs[0].value.trim();
    const url  = inputs[1].value.trim();
    if (name && url) {
      let finalUrl = url;
      if (!finalUrl.match(/^https?:\/\//)) finalUrl = 'https://' + finalUrl;
      newLinks.push({ name, url: finalUrl });
    }
  });
  if (newLinks.length === 0) { showToast('⚠️ 이름과 URL을 모두 입력해주세요'); return; }
  links = newLinks;
  saveToStorage();
  renderLinks();
  showToast('✅ 저장되었습니다!');
}

function renderLinks() {
  const grid = document.getElementById('links-grid');
  document.getElementById('link-count').textContent = links.length;
  if (links.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🌐</div><p>아직 저장된 링크가 없어요.<br>아래에서 이름과 URL을 입력하고 저장해보세요.</p></div>`;
    return;
  }
  grid.innerHTML = links.map(link => {
    const domain  = getDomain(link.url);
    const favicon = getFaviconUrl(link.url);
    return `
      <div class="link-card" onclick="openLink('${link.url.replace(/'/g,"\\'")}')">
        <div class="link-favicon">
          ${favicon ? `<img src="${favicon}" onerror="this.style.display='none';this.parentNode.innerHTML='🔗'">` : '🔗'}
        </div>
        <div class="link-info">
          <div class="link-name">${escHtml(link.name)}</div>
          <div class="link-domain">${escHtml(domain)}</div>
        </div>
      </div>`;
  }).join('');
}

function openLink(url) { window.open(url, '_blank'); }

function clearAll() {
  if (!confirm('저장된 링크를 모두 삭제할까요?')) return;
  links = []; saveToStorage(); renderLinks(); resetEditor();
  showToast('🗑️ 모두 삭제되었습니다');
}

function resetEditor() {
  document.getElementById('entries-list').innerHTML = '';
  addRow(); addRow();
}

function populateEditor() {
  const list = document.getElementById('entries-list');
  list.innerHTML = '';
  if (links.length === 0) { addRow(); addRow(); }
  else { links.forEach(l => addRow(l.name, l.url)); addRow(); addRow(); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

loadLinks();
populateEditor();
renderLinks();
</script>
</body>
</html>
